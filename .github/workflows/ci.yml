name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      AUTH_MODE: api_key
      API_KEY: test-only-key
      ECOM_DOWNLOAD_RERANKER: "0"
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q ecom_agent_matrix

      - name: Ruff checks
        run: ruff check ecom_agent_matrix test

      - name: Ruff formatting
        run: ruff format --check ecom_agent_matrix test

      - name: Run tests
        run: pytest -q
