[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-agent-matrix"
version = "0.2.0"
description = "Typed, fail-closed ecommerce agent runtime"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "httpx>=0.27,<1",
  "aiopg>=1.4,<2",
  "redis>=5,<7",
  "psycopg2-binary>=2.9,<3",
  "pgvector>=0.3,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT>=2.8,<3",
  "prometheus-client>=0.20,<1",
  "rank-bm25>=0.2,<1",
  "jieba>=0.42,<1",
  "python-dotenv>=1,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.16.8"]
rag-local = ["torch>=2.2,<3", "transformers>=4.44,<5", "sentence-transformers>=3,<6"]
finetune = ["torch>=2.2,<3", "transformers>=4.44,<5", "peft>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["ecom_agent_matrix*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
